name: Build USB AI APK
on:
  workflow_dispatch:
  push:
    branches:
      - usb-ai-android
    paths:
      - 'usb-ai-android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/build-usb-ai.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"
      - name: Build DiskAI web UI for Android WebView
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=./
          mkdir -p usb-ai-android/app/src/main/assets
          rm -rf usb-ai-android/app/src/main/assets/*
          cp -R dist/. usb-ai-android/app/src/main/assets/
      - name: Build debug APK
        working-directory: usb-ai-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: diskai-debug-apk
          path: usb-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
