<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Latar belakang hitam untuk sudut -->
  <rect width="512" height="512" fill="#000000" />
  
  <!-- Kotak putih dengan sudut membulat (squircle) -->
  <rect width="512" height="512" rx="160" fill="#ffffff" />
  
  <!-- Teks AX di tengah -->
  <text x="50%" y="54%" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="900" fill="#000000" text-anchor="middle" dominant-baseline="middle" letter-spacing="-12">AX</text>
</svg>
